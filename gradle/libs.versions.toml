[versions]
minecraft_version = "1.21.1"
neoforge_version = "21.1.252"

# Mod properties
version = "1.0.0"

# Mod dependencies
mafglib = "0.4.3+mc1.21.1"
jei = "19.27.0.340"
artifacts = "13.2.5"
tweakerge = "0.4.3+mc1.21.1"
create-railways-navigator = "rlsRwxq3" #"neoforge-1.21.1-beta-0.10.0-C6"

# Gradle plugin
neoforge-moddev = "2.0.148"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft_version" }

neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge_version" }
mafglib = { group = "maven.modrinth", name = "mafglib", version.ref = "mafglib" }
jei = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei" }
artifacts = { group = "maven.modrinth", name = "artifacts", version.ref = "artifacts" }
tweakerge = { group = "maven.modrinth", name = "tweakerge", version.ref = "tweakerge" }
create-railways-navigator = { group = "maven.modrinth", name = "create-railways-navigator", version.ref = "create-railways-navigator" }


[plugins]
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
